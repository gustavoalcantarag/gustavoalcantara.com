.tools{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:30px}

textarea{width:100%;padding:12px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:600 15px Nunito,sans-serif;resize:vertical;margin-bottom:14px}
.ck{display:block;padding:10px 12px;margin-bottom:8px;background:var(--card);border:2px solid var(--line);border-radius:12px;font-weight:600;cursor:pointer}
.ck input{margin-right:8px;accent-color:var(--ok)}
.rr{display:flex;justify-content:space-between;padding:10px 14px;margin-bottom:8px;background:var(--card);border:2px solid var(--line);border-radius:12px}

.box{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:600}

.box.q{border-color:var(--amb)}.box.q b{color:var(--amb)}
pre{margin:6px 0 0;padding:10px;background:var(--bg);border-radius:10px;overflow-x:auto;font-size:13px;line-height:1.5}

.nav{display:flex;gap:10px;margin-top:auto;padding-top:16px}
.nav .go{flex:1;width:auto}
.sec{padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:900 15px Nunito,sans-serif;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const U=[
{t:"Java moderno",i:"☕",q:[
["¿Qué devuelve <code>Optional.map</code> cuando el Optional está vacío?",["Lanza NullPointerException","Un Optional vacío","null","Un Optional con valor por defecto"],1,"map solo se aplica si hay valor; si no, devuelve Optional.empty() sin fallar."],
["¿Qué ventaja principal tiene un <code>record</code> (Java 16+)?",["Es mutable por defecto","Reduce boilerplate: constructor, getters, equals y hashCode","Permite herencia múltiple","Es más rápido que una clase"],1,"Un record es un contenedor de datos inmutable con todo lo básico generado."],
["¿Qué diferencia a <code>flatMap</code> de <code>map</code> en un Stream?",["No hay diferencia","flatMap aplana streams anidados en uno solo","map solo funciona con listas","flatMap siempre es paralelo"],1,"Si cada elemento produce un Stream, flatMap los une en uno; map dejaría un Stream de Streams."]]},
{t:"SOLID y patrones",i:"🧩",q:[
["Una clase valida datos, guarda en BD y envía correos. ¿Qué principio viola?",["Open/Closed","Single Responsibility","Liskov","Interface Segregation"],1,"Tiene tres razones para cambiar. Se separa en clases con una sola responsabilidad."],
["Necesitas cambiar en tiempo de ejecución el algoritmo que calcula comisiones. ¿Qué patrón usas?",["Singleton","Strategy","Prototype","Facade"],1,"Strategy encapsula algoritmos intercambiables detrás de una interfaz común."],
["¿Qué patrón añade comportamiento a un objeto sin modificar su clase?",["Decorator","Adapter","Builder","Observer"],0,"Decorator envuelve el objeto original e implementa su misma interfaz."]]},
{t:"Spring Boot y JPA",i:"🌱",q:[
["¿Qué es el problema N+1 en JPA?",["Una consulta principal más N consultas extra por relaciones lazy","N tablas sin índice","N transacciones anidadas","Un error del pool de conexiones"],0,"Se resuelve con join fetch, @EntityGraph o consultas con proyecciones."],
["¿Qué scope tienen por defecto los beans en Spring?",["prototype","singleton","request","session"],1,"Hay una única instancia por contenedor. Por eso los beans deben ser sin estado mutable."],
["Llamas a un método <code>@Transactional</code> desde otro método de la misma clase. ¿Qué pasa?",["Funciona igual","No se aplica la transacción (self-invocation)","Lanza error al arrancar","Crea una transacción nueva"],1,"Spring usa proxies; una llamada interna se salta el proxy y la anotación no actúa."]]},
{t:"Programación reactiva",i:"⚡",q:[
["¿Qué ocurre si nadie se suscribe a un <code>Mono</code> o <code>Flux</code>?",["Se ejecuta igual","Nada: es lazy","Lanza excepción","Corre en otro hilo"],1,"Hasta que hay un subscribe (o WebFlux lo hace por ti), no se ejecuta nada."],
["¿Cuándo usas <code>flatMap</code> en vez de <code>map</code> en Reactor?",["Cuando la función devuelve un Mono/Flux (operación asíncrona)","Cuando la función es síncrona","Nunca","Solo con listas"],0,"map transforma valores; flatMap aplana publishers internos."],
["¿Por qué no debes llamar <code>block()</code> dentro de un flujo WebFlux?",["Consume mucha memoria","Bloquea los pocos hilos del event loop y degrada todo el servicio","Falla la compilación","Rompe los tests"],1,"Un event loop atiende miles de peticiones con pocos hilos; bloquear uno los frena a todos."]]},
{t:"Microservicios resilientes",i:"🛡️",q:[
["¿Qué estados tiene un Circuit Breaker?",["Cerrado, abierto y semiabierto","Activo, pausado y detenido","Nuevo, ejecutando y fallido","Primario, secundario y réplica"],0,"Cerrado deja pasar; abierto corta tras muchos fallos; semiabierto prueba si el servicio se recuperó."],
["En una SAGA falla el tercer paso. ¿Qué haces?",["Un rollback distribuido con 2PC","Ejecutas transacciones compensatorias de los pasos anteriores","Ignoras el error","Reinicias los servicios"],1,"Cada paso tiene una acción que lo deshace (ej. reembolsar un cobro)."],
["¿Cómo evitas cobrar dos veces ante un reintento de un pago?",["Idempotency key por operación","Aumentar el timeout","Prohibir reintentos","Agregar más instancias"],0,"El servidor guarda la clave y devuelve el resultado original si la ve de nuevo."]]},
{t:"Testing y calidad",i:"🧪",q:[
["¿Cuál es el ciclo de TDD?",["Red, Green, Refactor","Build, Deploy, Test","Plan, Code, Release","Mock, Stub, Spy"],0,"Escribes un test que falla, haces que pase con lo mínimo y luego refactorizas."],
["¿Para qué sirve Mockito?",["Para simular dependencias y aislar la unidad bajo prueba","Para generar getters y setters","Para analizar la cobertura","Para desplegar contenedores"],0,"Permite probar un servicio sin su BD o API real y verificar interacciones."],
["¿Qué evalúa el quality gate de SonarQube?",["Solo el tiempo de compilación","Umbrales de bugs, vulnerabilidades, duplicación y cobertura","El número de commits","El tamaño del repositorio"],1,"Si no se cumplen, el pipeline puede bloquear el pase a producción."]]},
{t:"Seguridad y OWASP",i:"🔐",q:[

["¿Dónde guardas la contraseña de la BD en un entorno Azure?",["En application.properties versionado","En un gestor de secretos como Azure Key Vault","Dentro del código","En un collection de Postman"],1,"Los secretos se inyectan en tiempo de ejecución y no se versionan."],
["Un JWT sirve para…",["Transportar claims firmados y autenticar sin sesión en servidor","Cifrar la base de datos","Reemplazar HTTPS","Guardar sesiones en memoria"],0,"Va firmado; valida firma y expiración. No es secreto, así que no pongas datos sensibles."]]},
{t:"Azure y CI/CD",i:"☁️",q:[

["¿Qué hace Azure API Management?",["Publica, protege y gobierna APIs (autenticación, rate limit, políticas)","Compila proyectos Java","Almacena imágenes Docker","Monitorea la CPU"],0,"Actúa como puerta de entrada única para tus APIs."],
["¿Cuál es un orden típico de pipeline CI/CD?",["Build → tests → análisis Sonar → artefacto en Nexus/ACR → despliegue","Despliegue → build → tests","Sonar → despliegue → build","Tests → despliegue → compilar"],0,"Se valida la calidad antes de generar el artefacto y desplegarlo."]]},
{t:"Arquitectura y patrones II",i:"🏛️",q:[

["¿Qué propone CQRS?",["Separar el modelo de escritura (comandos) del de lectura (consultas)","Cifrar las comunicaciones","Evitar deadlocks","Reemplazar REST"],0,"Permite optimizar y escalar lecturas y escrituras por separado. Añade complejidad y consistencia eventual."],
["En arquitectura hexagonal, ¿qué es un puerto?",["Una interfaz que define cómo el dominio se comunica con el exterior","Un puerto TCP","Una tabla de la BD","Un contenedor Docker"],0,"Los adaptadores (REST, JPA, mensajería) implementan los puertos. El dominio no depende de frameworks."],
["¿Qué ventaja principal da una arquitectura orientada a eventos?",["Desacopla productores y consumidores","Garantiza consistencia inmediata","Elimina la necesidad de pruebas","Siempre usa menos infraestructura"],0,"A cambio: consistencia eventual, orden de mensajes y depuración más difícil."],
["¿Por qué es problemático un Singleton clásico con estado mutable?",["Es estado global compartido, difícil de testear y poco seguro entre hilos","Consume demasiada memoria","No funciona en Java 17","No puede implementar interfaces"],0,"En Spring el contenedor ya gestiona instancias únicas sin necesidad de implementar el patrón a mano."],
["¿Qué hace el patrón Prototype?",["Crea objetos nuevos clonando uno existente","Construye objetos paso a paso","Ofrece una interfaz simplificada a un subsistema","Notifica cambios a observadores"],0,"Útil cuando crear un objeto desde cero es costoso. Se confunde con Builder, que construye por pasos."]]},
{t:"Spring Cloud y Security",i:"🔑",q:[
["¿Qué función cumple Spring Cloud Gateway?",["Punto de entrada único: enrutamiento, filtros, rate limiting y seguridad","Persistir datos","Compilar el proyecto","Generar pruebas"],0,"Centraliza lo transversal para que cada microservicio no lo repita."],
["¿Para qué sirve Spring Cloud Config?",["Centralizar la configuración externa de los microservicios","Balancear la base de datos","Cifrar tokens JWT","Generar Swagger"],0,"La configuración vive en un repositorio y cada entorno la consume sin recompilar."],
["¿Qué resuelve el descubrimiento de servicios (Eureka, Consul)?",["Que los servicios se registren y se encuentren sin IPs fijas","Escanear puertos abiertos","Centralizar logs","Encolar mensajes"],0,"En contenedores las IPs cambian; se localiza por nombre del servicio. En Kubernetes lo hace su propio DNS."],
["En OAuth2, ¿quién emite el access token?",["El servidor de autorización","El resource server","El cliente","El navegador"],0,"El resource server (tu API) solo valida el token y sus permisos."],
["En Spring Security, ¿qué define un <code>SecurityFilterChain</code>?",["La cadena de filtros que autentica y autoriza cada petición HTTP","Las tablas de usuarios","El cifrado de la BD","El pool de conexiones"],0,"Ahí configuras rutas públicas, roles, CORS, CSRF y validación de JWT."],
["¿Por qué guardar contraseñas con BCrypt y no con SHA-256 simple?",["BCrypt es lento a propósito y usa salt, lo que frena la fuerza bruta","Genera hashes más cortos","Es reversible","Java lo exige"],0,"Un hash rápido facilita probar miles de millones de combinaciones por segundo."]]},
{t:"Diseño de APIs REST",i:"🌐",q:[
["¿Qué código HTTP corresponde a un recurso creado con éxito?",["201 Created","200 OK","204 No Content","302 Found"],0,"Idealmente con la cabecera Location apuntando al nuevo recurso."],
["¿Qué significa que un método HTTP sea idempotente?",["Repetirlo produce el mismo efecto que ejecutarlo una vez","No tiene body","Siempre devuelve 200","Siempre es cacheable"],0,"GET, PUT y DELETE lo son; POST normalmente no, por eso se usa una idempotency key en pagos."],
["Llega un JSON con campos inválidos. ¿Qué código devuelves?",["400 Bad Request","500 Internal Server Error","404 Not Found","403 Forbidden"],0,"Es error del cliente. Un 500 indicaría un fallo del servidor."],
["¿Cuál es la diferencia entre 401 y 403?",["401: no autenticado; 403: autenticado pero sin permisos","Son equivalentes","401: servidor caído; 403: token expirado","401: recurso inexistente; 403: error de BD"],0,"Una pregunta clásica de entrevista: autenticación vs autorización."],
["¿Qué ventaja tiene GraphQL frente a REST?",["El cliente pide solo los campos que necesita en una única petición","Es siempre más rápido","No requiere esquema","Reemplaza a HTTP"],0,"Evita over-fetching y under-fetching. Complica el caché y el control del costo de las consultas."],
["¿Qué es SOAP/WSDL y por qué aparece en banca?",["Un protocolo basado en XML con contrato formal, común en sistemas legados","Un formato binario","Una librería de JavaScript","Un tipo de base de datos"],0,"Muchos core bancarios exponen SOAP. Debes saber integrarlos y envolverlos con una API REST moderna."]]},
{t:"Bases de datos y SQL",i:"🗄️",q:[
["¿Para qué sirve un índice?",["Acelerar lecturas a costa de escrituras y espacio","Garantizar integridad referencial","Cifrar columnas","Reducir el número de tablas"],0,"Cada INSERT/UPDATE debe mantener el índice. Indexa columnas de filtros y joins frecuentes."],
["¿Qué garantiza la 'I' de ACID?",["Aislamiento: transacciones concurrentes no se interfieren entre sí","Integridad de la red","Indexación","Inmutabilidad"],0,"El nivel de aislamiento define qué anomalías se permiten a cambio de rendimiento."],
["Lees dos veces la misma fila en una transacción y el valor cambió porque otra confirmó. ¿Qué anomalía es?",["Non-repeatable read","Dirty read","Deadlock","Lost update"],0,"Dirty read es leer datos aún no confirmados. Repeatable Read o Serializable lo evitan."],
["¿Qué diferencia hay entre INNER JOIN y LEFT JOIN?",["INNER solo devuelve filas con coincidencia; LEFT conserva todas las de la izquierda","Son iguales","LEFT siempre es más rápido","INNER conserva todas las filas"],0,"En LEFT JOIN, las filas sin coincidencia traen NULL en las columnas de la derecha."],
["¿Para qué usas <code>EXPLAIN</code> (plan de ejecución)?",["Ver cómo el motor ejecutará la consulta y detectar full scans","Ejecutar y borrar datos","Crear índices automáticamente","Hacer un backup"],0,"Es la primera herramienta para optimizar consultas lentas."],
["En una transferencia bancaria, ¿por qué usas una transacción?",["Para que el débito y el crédito ocurran ambos o ninguno","Para que sea más rápida","Para evitar usar índices","Para cifrar los datos"],0,"Es atomicidad. Entre microservicios no hay transacción única, por eso se usa SAGA."]]},
{t:"Java avanzado",i:"🧠",q:[

/* ===== ESTADO ===== */
const KEY='rbj-v1',$=s=>document.querySelector(s);
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{xp:0,st:{},streak:0,last:''};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const day=d=>new Date(d).toISOString().slice(0,10);

function bump(){const t=day(Date.now());if(S.last!==t){S.streak=S.last===day(Date.now()-864e5)?S.streak+1:1;S.last=t}}

/* ===== RUTA ===== */
function render(){
  $('#xp').textContent=S.xp;$('#sk').textContent=S.streak;
  const ov=Object.values(S.oral||{});$('#ob').textContent='🎙️ Práctica oral'+(ov.length?' · '+Math.round(ov.reduce((a,b)=>a+b,0)/ov.length)+'%':'');
  $('#bar').style.width=Object.keys(S.st).length/U.length*100+'%';
  $('#path').innerHTML=U.map((u,i)=>{
    const d=S.st[i]!==undefined,ok=i===0||S.st[i-1]!==undefined,x=[0,50,0,-50][i%4];
    const sub=d?`<span class="stars">${'★'.repeat(S.st[i])+'☆'.repeat(3-S.st[i])}</span>`:ok?'Empezar':'Bloqueado';
    return `<div class="row" style="transform:translateX(${x}px)"><button class="node ${d?'done':ok?'open':'lock'}" ${ok?'':'disabled'} aria-label="${u.t}" onclick="start(${i})">${ok?u.i:'🔒'}</button><div class="lbl">${u.t}<small>${sub}</small></div></div>`}).join('');
}

/* ===== LECCIÓN ===== */
let L;
function quiz(i){
  L={i,n:0,h:3,ans:false,qs:U[i].q.map(q=>({q:q[0],e:q[3],o:q[1].map((t,k)=>[t,k===q[2]]).sort(()=>Math.random()-.5)}))};
  $('#modal').className='on';ask();
}
function ask(){
  const q=L.qs[L.n];
  $('#modal').innerHTML=`<div class="card"><div class="top"><button class="x" aria-label="Salir" onclick="closeM()">✕</button><div class="pb"><i style="width:${L.n/L.qs.length*100}%"></i></div><span class="st">❤️ ${L.h}</span></div><h2>${q.q}</h2>${q.o.map((o,k)=>`<button class="opt" onclick="pick(${k},this)">${o[0]}</button>`).join('')}<div id="fb"></div></div>`;
}
function pick(k,b){
  if(L.ans)return;L.ans=true;
  const q=L.qs[L.n],ok=q.o[k][1];
  document.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(q.o[j][1])x.classList.add('ok')});
  if(ok){S.xp+=10}else{b.classList.add('bad');L.h--}
  save();
  const end=L.h<=0||L.n===L.qs.length-1;
  const f=$('#fb');f.className=ok?'good':'no';
  f.innerHTML=`<b>${ok?'¡Correcto! +10 XP':'Incorrecto'}</b><p>${q.e}</p><button class="go" onclick="${end?'finish()':'next()'}">${end?'Terminar':'Continuar'}</button>`;
  f.querySelector('.go').focus();
}
function next(){L.n++;L.ans=false;ask()}
function finish(){
  const pass=L.h>0;
  if(pass){S.st[L.i]=Math.max(S.st[L.i]||0,L.h);bump()}
  save();
  $('#modal').innerHTML=`<div class="card c"><h1>${pass?'🎉 ¡Nivel completado!':'💔 Te quedaste sin vidas'}</h1>${pass?`<div class="stars" style="font-size:36px">${'★'.repeat(L.h)+'☆'.repeat(3-L.h)}</div><p>Ganaste experiencia y desbloqueaste el siguiente nivel.</p>`:'<p>Repasa las explicaciones y vuelve a intentarlo.</p>'}<button class="go" onclick="closeM()">Volver a la ruta</button>${!pass&&STUDY[U[L.i].t]?`<button class="sec" style="margin-top:12px" onclick="study(${L.i},0)">📖 Repasar la lección</button>`:''}</div>`;
}
function closeM(){$('#modal').className='';render()}
function reset(){if(confirm('¿Borrar todo tu progreso?')){S={xp:0,st:{},streak:0,last:''};save();render()}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').className)closeM()});
/* ===== SIMULACRO: 15 preguntas mezcladas, 15 min, resultado por tema ===== */
let M;
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function sim(){
  const all=U.flatMap(u=>u.q.map(q=>({t:u.t,q:q[0],o:q[1].map((x,k)=>[x,k===q[2]]).sort(()=>Math.random()-.5)})));
  M={qs:all.sort(()=>Math.random()-.5).slice(0,15),n:0,r:[],t:900};
  $('#modal').className='on';
  M.iv=setInterval(()=>{
    if(!$('#modal').className){clearInterval(M.iv);return}
    M.t--;const e=$('#tm');if(e)e.textContent=fmt(M.t);if(M.t<=0)simEnd();
  },1000);
  simAsk();
}
function simAsk(){
  const q=M.qs[M.n];
  $('#modal').innerHTML=`<div class="card"><div class="top"><button class="x" aria-label="Salir" onclick="simQuit()">✕</button><div class="pb"><i style="width:${M.n/M.qs.length*100}%"></i></div><span class="st">⏱️ <span id="tm">${fmt(M.t)}</span></span></div><p class="mut">Pregunta ${M.n+1} de ${M.qs.length}</p><h2>${q.q}</h2>${q.o.map((o,k)=>`<button class="opt" onclick="simPick(${k})">${o[0]}</button>`).join('')}</div>`;
}
function simPick(k){M.r.push(M.qs[M.n].o[k][1]);if(++M.n>=M.qs.length)simEnd();else simAsk()}
function simQuit(){if(confirm('¿Salir del simulacro? Se perderá este intento.')){clearInterval(M.iv);closeM()}}
function simEnd(){
  clearInterval(M.iv);
  const T={};M.qs.forEach((q,i)=>{const v=T[q.t]=T[q.t]||{ok:0,n:0};v.n++;if(M.r[i])v.ok++});
  const ok=M.r.filter(Boolean).length,n=M.qs.length,p=Math.round(ok/n*100);
  S.xp+=ok*5;save();
  $('#modal').innerHTML=`<div class="card"><h1 style="text-align:center">${p>=80?'🏆':p>=60?'👍':'📚'} ${ok}/${n} · ${p}%</h1><p class="mut" style="text-align:center;margin-bottom:20px">${p>=80?'Muy bien. Ahora practica explicarlo en voz alta.':p>=60?'Buen avance. Refuerza los temas en rojo.':'Repasa los temas en rojo y reintenta.'} Las preguntas sin responder cuentan como fallo.</p>${Object.entries(T).map(([t,v])=>`<div class="rr"><span>${t}</span><b class="${v.ok===v.n?'g':'r'}">${v.ok}/${v.n}</b></div>`).join('')}<button class="go" style="margin-top:20px" onclick="closeM()">Volver a la ruta</button></div>`;
}

["Problema N+1","Cargas N entidades con 1 consulta y, al acceder a una relación lazy de cada una, Hibernate lanza N consultas más. Con 1000 clientes son 1001 consultas.","¿Cómo lo detectas y lo resuelves? Activas el log de SQL y usas join fetch, @EntityGraph o proyecciones.",`@Query("select c from Cliente c join fetch c.cuentas")
List&lt;Cliente&gt; findAllConCuentas();
// 1 sola consulta en vez de 1001`],
["@Transactional y el proxy","Spring envuelve el bean en un proxy que abre y cierra la transacción. Si llamas al método desde la misma clase, la llamada no pasa por el proxy y la anotación no actúa. Por defecto solo hace rollback con RuntimeException.","¿Por qué mi @Transactional no hizo rollback? Revisa self-invocation y el tipo de excepción.",`public void procesar(){
  guardar();   // llamada interna: sin proxy, NO hay transacción
}
@Transactional
void guardar(){ ... }
// Solución: mover guardar() a otro bean`],
["Beans singleton","Por defecto hay una sola instancia de cada bean para toda la aplicación y la comparten todos los hilos. Por eso un bean no debe guardar estado mutable del usuario o de la petición.","¿Qué pasa si guardas datos de la petición en un campo de un @Service? Se mezclan entre usuarios (race condition).",`@Service class Mal {
  private Usuario actual;     // compartido: peligroso
}
@Service class Bien {
  Resp procesar(Usuario u){ ... }  // estado local
}`]],
"Programación reactiva":[
["Todo es lazy","Un Mono/Flux describe qué hacer, pero no ejecuta nada hasta que alguien se suscribe. En WebFlux el framework se suscribe por ti cuando devuelves el Mono desde el controlador.","¿Por qué mi llamada no se ejecuta? Porque nadie hizo subscribe (o se descartó el Mono).",`Mono&lt;String&gt; m = Mono.fromSupplier(() -> llamar());
// aquí todavía no pasó nada
m.subscribe(System.out::println);  // ahora sí`],
["map vs flatMap","map transforma el valor con una función normal. flatMap se usa cuando esa función devuelve otro Mono/Flux (otra operación asíncrona) y lo aplana dentro de la cadena.","¿Cuándo usas flatMap? Cuando dentro llamas a otro servicio o a una BD reactiva.",`repo.findById(id)                       // Mono&lt;Cuenta&gt;
  .map(c -> c.getSaldo())               // valor simple
  .flatMap(s -> antifraude.validar(s)); // devuelve Mono`],
["No bloquees el event loop","WebFlux atiende miles de peticiones con pocos hilos. Un block() o un JDBC bloqueante detiene uno de esos hilos y puede degradar todo el servicio.","¿Qué haces si tienes una librería bloqueante? La aíslas con subscribeOn(Schedulers.boundedElastic()).",`Mono.fromCallable(() -> legado.consultar())  // bloqueante
    .subscribeOn(Schedulers.boundedElastic());`]],
"Microservicios resilientes":[
["Circuit Breaker","Si un servicio falla seguido, se deja de llamarlo por un tiempo y se responde rápido con un fallback. Estados: cerrado (normal), abierto (corta) y semiabierto (prueba si ya se recuperó).","¿Qué pasa si el core bancario está caído? Se abre el circuito, respondes un fallback y no lo saturas.",`@CircuitBreaker(name = "core", fallbackMethod = "saldoCache")
public Mono&lt;Saldo&gt; consultar(String cuenta){ ... }`],
["SAGA","Una operación entre varios servicios se divide en pasos locales. Si uno falla, se ejecutan acciones compensatorias de los pasos anteriores, en vez de una transacción distribuida.","Debitaste pero falló el crédito: ¿qué haces? Compensas reponiendo el débito y dejas el estado auditable.",`1. Cuentas: debitar origen            OK
2. Cuentas: acreditar destino        FALLA
3. Compensación: reponer el débito   OK
Estado de la transferencia: FALLIDA`],
["Idempotencia","Repetir una operación produce el mismo efecto que hacerla una vez. En pagos los reintentos son inevitables, así que cada operación lleva una clave única.","¿Cómo evitas cobrar dos veces? Con una Idempotency-Key guardada junto al resultado.",`POST /transferencias
Idempotency-Key: 7f3a-91c2
// 2.ª vez con la misma clave
// -> devuelve el resultado guardado, no repite`]],
"Seguridad y OWASP":[
["Inyección SQL","Ocurre cuando concatenas texto del usuario dentro de una consulta. Con parámetros, la entrada nunca se interpreta como código SQL.","¿Cómo la previenes? Con consultas parametrizadas (PreparedStatement o JPA), nunca concatenando.",`// Mal
"select * from u where nombre='" + nombre + "'"

// Bien
@Query("select u from Usuario u where u.nombre = :n")`],
["Manejo de secretos","Contraseñas y claves no van en el código ni en el repositorio. Se guardan en un gestor (Azure Key Vault) y se inyectan al arrancar.","¿Dónde guardas la clave de la BD? En Key Vault, accedido con una identidad administrada.",`# application.yml
spring.datasource.password: \${DB_PASSWORD}  # viene de Key Vault`],
["401 vs 403 y JWT","Autenticación: quién eres (401 si falla). Autorización: qué puedes hacer (403 si no tienes permiso). El JWT es un token firmado que el servicio valida sin consultar una sesión.","¿Cuándo 401 y cuándo 403? Sin token válido, 401; con token pero sin permiso, 403.",`@PreAuthorize("hasRole('CLIENTE')")
@GetMapping("/cuentas/{id}/saldo")
public Mono&lt;Saldo&gt; saldo(@PathVariable String id){ ... }`]],
"Diseño de APIs REST":[
["Códigos HTTP","El código comunica el resultado sin leer el body: 2xx éxito, 4xx error del cliente, 5xx error del servidor.","¿Qué devuelves si el JSON es inválido? ¿Y si el recurso ya existe? ¿Y si falla tu servidor?",`201 Created      recurso creado
400 Bad Request  datos inválidos
401 / 403        sin autenticar / sin permiso
404 Not Found    no existe
409 Conflict     duplicado o conflicto de estado
500              falla del servidor`],
["Idempotencia en HTTP","GET, PUT y DELETE son idempotentes; POST no. Por eso, en operaciones críticas con POST (pagos), se añade una clave de idempotencia.","¿Es PUT idempotente? Sí: reemplazar el mismo recurso dos veces deja el mismo estado.",`PUT  /clientes/10 {"nombre":"Ana"}   // repetir = mismo resultado
POST /transferencias                 // repetir = otra transferencia`],
["Diseño de recursos","Usa sustantivos en plural y una jerarquía lógica; la acción la da el método HTTP. Versiona la API (/v1) y documéntala con OpenAPI.","¿Cómo nombras la API para ver los movimientos de una cuenta? Evita verbos como /obtenerSaldo.",`GET  /v1/cuentas/{id}/movimientos?pagina=1
POST /v1/transferencias`]],
"WebFlux a fondo":[
["subscribeOn vs publishOn","Controlan en qué hilo corre tu cadena. subscribeOn decide dónde arranca la suscripción (afecta desde el origen); publishOn cambia el hilo para los operadores que vienen después.","¿Qué diferencia hay entre subscribeOn y publishOn y para qué las usas? Para mover trabajo bloqueante fuera del event loop.",`Mono.fromCallable(() -> legado.consultar())
    .subscribeOn(Schedulers.boundedElastic())  // el origen, en otro hilo
    .map(this::transformar)
    .publishOn(Schedulers.parallel())          // lo siguiente, en otro
    .map(this::calcular);`],
["Manejo de errores","Un try/catch no captura errores asíncronos. Se manejan dentro de la cadena: onErrorResume devuelve otro publisher, onErrorReturn un valor, onErrorMap traduce la excepción y retryWhen reintenta.","¿Cómo te recuperas si el servicio de antifraude falla? Con timeout, reintentos y onErrorResume con un fallback.",`antifraude.validar(tx)
  .timeout(Duration.ofSeconds(2))
  .retryWhen(Retry.backoff(2, Duration.ofMillis(200)))
  .onErrorResume(e -> Mono.just(Resultado.REVISION_MANUAL));`],
["Mono.zip y switchIfEmpty","Mono.zip lanza varios Mono a la vez y combina sus resultados cuando todos terminan; es más rápido que encadenarlos. switchIfEmpty ejecuta una alternativa si el Mono llega vacío.","¿Cómo consultas saldo y movimientos sin esperar uno por uno? Con Mono.zip.",`Mono.zip(saldoSvc.get(id), movSvc.ultimos(id))
    .map(t -> new Resumen(t.getT1(), t.getT2()));

repo.findById(id)
    .switchIfEmpty(Mono.error(new NoEncontrado()));`]],
"SAGA y mensajería":[
["Coreografía vs orquestación","Coreografía: cada servicio reacciona a eventos de otros, sin jefe; es desacoplada pero difícil de seguir. Orquestación: un orquestador indica el siguiente paso; da más control y visibilidad, pero es un punto central.","¿Cuál eliges para una transferencia bancaria y por qué? Normalmente orquestación, por la trazabilidad y la auditoría.",`Orquestación:
  Orquestador -> Cuentas.debitar    OK
  Orquestador -> Cuentas.acreditar  FALLA
  Orquestador -> Cuentas.reponer débito
Coreografía:
  Debitado (evento) -> Acreditar reacciona -> publica Acreditado`],
["Patrón Outbox","Si guardas en la BD y luego publicas el mensaje, puede fallar entre ambos y perderse el evento. Con Outbox guardas el evento en la misma transacción local y un proceso aparte lo publica.","¿Cómo garantizas que no se pierda un evento al confirmar una transferencia?",`@Transactional
void transferir(Tx t){
  repo.save(t);
  outbox.save(new Evento("TransferenciaCreada", t.id()));
}
// Otro proceso lee la tabla outbox y publica en Kafka`],
["Consumidores idempotentes y DLQ","La mayoría de brokers entrega 'al menos una vez', así que un mensaje puede llegar repetido. El consumidor guarda el id procesado. Si un mensaje falla tras varios reintentos, va a una Dead Letter Queue para analizarlo.","¿Qué haces si llega dos veces el mismo mensaje? ¿Y si uno falla siempre?",`if (procesados.existe(msg.id())) return;   // ya procesado
aplicar(msg);
procesados.guardar(msg.id());
// tras 3 fallos -> cola de errores (DLQ)`]],
"Patrones de diseño a fondo":[
["Factory y Builder","Factory decide qué clase concreta crear sin que el cliente la conozca. Builder arma objetos con muchos parámetros opcionales de forma legible e inmutable.","¿Cuándo usas Factory y cuándo Builder? Factory: varias implementaciones; Builder: muchos parámetros.",`PagoProcesador p = PagoFactory.para(TipoTarjeta.CREDITO);

Cliente c = Cliente.builder()       // Lombok @Builder
    .nombre("Ana").email("a@x.com").build();`],
["Adapter vs Facade","Adapter traduce una interfaz a otra que el cliente espera, ideal para envolver un servicio SOAP legado. Facade ofrece una interfaz simple sobre un subsistema complejo. Adapter traduce, Facade simplifica.","¿Cómo integras un servicio SOAP del core sin contaminar tu dominio? Con un Adapter.",`class CoreSaldoAdapter implements SaldoPort {
  private final CoreSoapClient soap;
  public Saldo consultar(String cta){
    return mapear(soap.getBalance(cta));  // SOAP -> dominio
  }
}`],
["Proxy y Observer","Proxy controla el acceso a un objeto (Spring lo usa en @Transactional y AOP). Observer notifica a varios suscriptores cuando algo cambia y es la base de los eventos.","¿Dónde ves Proxy en Spring? ¿Cómo desacoplas enviar un correo al crear una cuenta? Con eventos (Observer).",`publisher.publishEvent(new CuentaCreada(id));

@EventListener
void enviarBienvenida(CuentaCreada e){ ... }`]],
"Arquitectura y patrones II":[
["Cache Aside","La aplicación consulta primero la caché; si no está, lee de la BD, guarda en caché y devuelve. Al modificar el dato hay que invalidar la caché para no servir datos viejos.","¿Cómo aceleras la consulta de datos que casi no cambian, como un catálogo de bancos?",`valor = cache.get(clave)
si es null:
    valor = bd.leer(clave)
    cache.put(clave, valor, ttl = 10 min)
retornar valor`],
["CQRS y hexagonal","CQRS separa el modelo de escritura (comandos) del de lectura (consultas) para optimizar cada uno. Hexagonal pone el dominio al centro: los puertos son interfaces y los adaptadores (REST, JPA, Kafka) las implementan, así el negocio no depende de frameworks.","¿Qué ventaja da la arquitectura hexagonal? Dominio testeable y poder cambiar tecnología sin tocar el negocio.",`domain/    Transferencia, SaldoPort   (puerto)
adapters/  SaldoJpaAdapter, TransferenciaController
// El dominio no importa Spring ni JPA`],
["Event-Driven","Los servicios se comunican publicando y consumiendo eventos, sin llamarse entre sí. Ganas desacople y escalabilidad; pierdes consistencia inmediata y depurar es más difícil.","¿Cuál es el trade-off de una arquitectura orientada a eventos?",`Cuentas publica: TransferenciaCompletada
  -> Notificaciones envía el SMS
  -> Auditoría registra el movimiento
(Cuentas no conoce a ninguno de los dos)`]],
"Bases de datos y SQL":[
["Índices","Un índice es una estructura (normalmente un árbol B) que permite encontrar filas sin recorrer toda la tabla. Acelera las lecturas, pero cada INSERT o UPDATE debe mantenerlo y ocupa espacio.","Una consulta por número de cuenta tarda segundos. ¿Qué revisas? El plan de ejecución (EXPLAIN en PostgreSQL/MySQL, EXPLAIN PLAN en Oracle) y si hay índice en la columna del filtro.",`-- Lenta: recorre toda la tabla
SELECT * FROM movimientos WHERE cuenta_id = 123;

CREATE INDEX idx_mov_cuenta ON movimientos(cuenta_id);
-- Ahora el plan de ejecución usa el índice`],
["ACID y aislamiento","ACID: Atomicidad (todo o nada), Consistencia, Aislamiento (las transacciones concurrentes no se pisan) y Durabilidad. El nivel de aislamiento define qué anomalías se toleran: dirty read, non-repeatable read y phantom read.","¿Qué es un non-repeatable read? Leer dos veces la misma fila en una transacción y obtener valores distintos porque otra confirmó un cambio.",`T1: SELECT saldo FROM cuentas WHERE id=1;   -- 100
T2: UPDATE cuentas SET saldo=50 WHERE id=1; COMMIT;
T1: SELECT saldo FROM cuentas WHERE id=1;   -- 50 (cambió)
-- Repeatable Read o Serializable lo evitan`],
["JOINs y transacciones","INNER JOIN devuelve solo las filas con coincidencia en ambas tablas; LEFT JOIN conserva todas las de la izquierda y rellena con NULL. En una transferencia, el débito y el crédito van en una sola transacción para que ocurran ambos o ninguno.","¿Qué diferencia hay entre INNER y LEFT JOIN? Un caso de LEFT: listar clientes aunque no tengan cuentas.",`SELECT c.nombre, a.numero
FROM clientes c
LEFT JOIN cuentas a ON a.cliente_id = c.id;  -- incluye clientes sin cuenta

BEGIN;
UPDATE cuentas SET saldo = saldo - 100 WHERE id = 1;
UPDATE cuentas SET saldo = saldo + 100 WHERE id = 2;
COMMIT;`]],
"Testing y calidad":[
["TDD","Ciclo Red-Green-Refactor: escribes un test que falla, haces lo mínimo para que pase y refactorizas con la seguridad de que los tests te protegen. Empuja hacia diseños simples y desacoplados.","¿Cómo aplicas TDD en un caso real? Parto del comportamiento esperado, escribo el test, luego el código y después refactorizo.",`@Test
void comisionPremiumEsCero(){
  assertEquals(0, new Premium().calcular(1000));  // RED: aún no existe
}
// GREEN: implementas Premium.calcular -> return 0
// REFACTOR: limpias sin romper el test`],
["Mockito y tipos de prueba","Mockito simula las dependencias de la clase que pruebas (BD, APIs) para probar solo su lógica, rápido y sin infraestructura. when/thenReturn define respuestas y verify comprueba interacciones. Una prueba de integración, en cambio, prueba componentes reales juntos.","¿Qué diferencia hay entre prueba unitaria e integración? La unitaria aísla con mocks; la de integración usa componentes reales.",`@ExtendWith(MockitoExtension.class)
class TransferenciaServiceTest {
  @Mock CuentaRepo repo;
  @InjectMocks TransferenciaService service;

  @Test void falla_si_no_hay_saldo(){
    when(repo.saldo(1L)).thenReturn(BigDecimal.TEN);
    assertThrows(SaldoInsuficiente.class,
      () -> service.transferir(1L, 2L, BigDecimal.valueOf(100)));
    verify(repo, never()).guardar(any());
  }
}`],
["SonarQube y quality gate","SonarQube analiza el código y mide bugs, vulnerabilidades, code smells, duplicación y cobertura. El quality gate son umbrales que, si no se cumplen, bloquean el pase en el pipeline.","Sonar bloquea tu PR. ¿Qué haces? Reviso el detalle, corrijo la causa y no bajo el umbral para pasar.",`Pipeline: build -> tests -> análisis Sonar -> quality gate
El gate FALLA, por ejemplo, si:
  - hay una vulnerabilidad nueva
  - la cobertura del código nuevo es menor al umbral
  - la duplicación supera el máximo permitido`]],
"Liderazgo y entrevista":[
["Code review que eleva al equipo","Un buen review se enfoca en el código, no en la persona: explica el porqué, propone alternativas y distingue lo obligatorio de lo opcional. El objetivo es que el equipo aprenda y se cumplan los estándares.","Un compañero entrega código que funciona pero rompe los estándares. ¿Cómo lo manejas?",`Comentario débil:   "Esto está mal."
Comentario fuerte:  "Este método valida y guarda a la vez.
  Si los separamos (SRP) será más fácil de probar.
  ¿Lo revisamos juntos?"`],
["Decisiones y plazos","Ante un desacuerdo técnico, compara trade-offs con criterios objetivos (requisitos, riesgo, costo, tiempo) y deja la decisión por escrito (ADR). Ante una fecha imposible, explica el riesgo con datos y propone alternativas de alcance o por fases.","El negocio pide en 2 semanas algo que toma 6. ¿Qué haces?",`"Para esa fecha podemos entregar consulta de saldo y
 transferencias. Notificaciones y reportes van en una
 segunda fase. Recortar pruebas subiría el riesgo de
 errores en producción. ¿Priorizamos así?"`],
["STAR, lo que no sabes y la IA","STAR ordena tus historias: Situación, Tarea, Acción y Resultado, con un dato medible y lo que hiciste tú. Si no sabes algo, admítelo y razona en voz alta. Si usas IA para programar, di que revisas, entiendes y pruebas todo lo que genera.","¿Usas IA al programar? Sí, como apoyo: reviso, entiendo, pruebo y valido seguridad antes de integrar.",`// Ejemplo ilustrativo: usa tus propios datos reales
S: Las consultas de saldo tardaban 4 s en horas pico.
T: Yo debía bajar la latencia sin cambiar el contrato.
A: Detecté un N+1, usé join fetch y agregué caché.
R: Bajó a 600 ms.`]],
"Java moderno":[
["Optional y records","Optional representa un valor que puede faltar y evita null y NPE. Un record (Java 16+) es una clase inmutable de datos con constructor, getters, equals, hashCode y toString generados.","¿Qué ventaja tiene un record? Menos boilerplate e inmutabilidad, ideal para DTOs.",`record CuentaDto(String numero, BigDecimal saldo) {}

Optional&lt;Cuenta&gt; c = repo.buscar(id);
String num = c.map(Cuenta::numero).orElse("N/A");`],
["Streams","Un Stream procesa colecciones de forma declarativa: filter, map, reduce, collect. flatMap aplana streams anidados. Son perezosos: nada se ejecuta hasta la operación terminal.","¿Qué diferencia hay entre map y flatMap en un Stream? flatMap aplana cada elemento que produce a su vez un Stream.",`List&lt;String&gt; nombres = clientes.stream()
    .filter(c -> c.activo())
    .map(Cliente::nombre)
    .toList();

cuentas.stream().flatMap(c -> c.movimientos().stream());`],
["Novedades de Java 17","Java 17 trae sealed classes (restringen quién puede heredar), switch como expresión, pattern matching en instanceof y text blocks. El pattern matching en switch llega estable en Java 21.","¿Qué aportan las sealed classes? Modelar un conjunto cerrado de tipos que el compilador puede verificar.",`sealed interface Pago permits Tarjeta, Transferencia {}

if (pago instanceof Tarjeta t) { cobrar(t); }  // pattern matching

String etiqueta = switch (estado) {            // switch como expresión
  case APROBADO  -> "OK";
  case RECHAZADO -> "Falló";
};`]],
"Java avanzado":[
["Concurrencia y volatile","Cuando varios hilos tocan el mismo dato aparecen las race conditions. volatile garantiza visibilidad, pero no atomicidad: count++ son tres pasos (leer, sumar, escribir). Para eso usa AtomicInteger, synchronized o locks.","Dos hilos incrementan un contador y se pierden incrementos. ¿Por qué y cómo lo arreglas?",`int count = 0;
count++;                                  // no es atómico

AtomicInteger seguro = new AtomicInteger();
seguro.incrementAndGet();                 // seguro entre hilos`],
["HashMap, equals y hashCode","HashMap usa hashCode para elegir el bucket y equals para comparar dentro de él. Si dos objetos son iguales deben tener el mismo hashCode: si sobreescribes uno, sobreescribe el otro.","¿Qué pasa si sobreescribes equals pero no hashCode? El objeto puede no encontrarse en un HashMap.",`record ClaveCuenta(String banco, String numero) {}
// El record ya genera equals y hashCode consistentes

Map&lt;ClaveCuenta, Saldo&gt; mapa = new HashMap&lt;&gt;();`],
["Memoria, GC y virtual threads","El GC libera lo que ya no es alcanzable. Un memory leak ocurre cuando quedan referencias vivas (por ejemplo una colección estática que solo crece). Los virtual threads (Java 21) permiten miles de hilos ligeros para I/O bloqueante.","¿Cómo detectas un memory leak? Con un heap dump o un profiler, viendo qué objetos se acumulan y quién los referencia.",`static final List&lt;Sesion&gt; CACHE = new ArrayList&lt;&gt;();
CACHE.add(sesion);   // nunca se limpia -> leak

try (var ex = Executors.newVirtualThreadPerTaskExecutor()) {
  ex.submit(() -> llamarServicio());   // Java 21
}`]],
"Spring Cloud y Security":[
["Gateway y Config","Spring Cloud Gateway es la puerta de entrada única: enruta, aplica filtros, rate limiting y seguridad. Spring Cloud Config centraliza la configuración externa de los microservicios para cambiarla sin recompilar.","¿Para qué usas un API Gateway? Para no repetir lo transversal (auth, límites, enrutamiento) en cada servicio.",`spring:
  cloud:
    gateway:
      routes:
        - id: cuentas
          uri: lb://cuentas-service
          predicates:
            - Path=/v1/cuentas/**`],
["Descubrimiento de servicios","En contenedores las IPs cambian. Con descubrimiento de servicios (Eureka, Consul) cada servicio se registra y los demás lo localizan por nombre. En Kubernetes lo resuelve su propio DNS.","¿Cómo se encuentran los servicios sin IPs fijas? Por nombre lógico, resuelto por el registro o por DNS.",`// Se llama por nombre lógico, no por IP
webClient.get()
  .uri("http://cuentas-service/v1/saldo/{id}", id)
  .retrieve().bodyToMono(Saldo.class);`],
["OAuth2, JWT y BCrypt","En OAuth2 el servidor de autorización emite el access token; tu API (resource server) solo lo valida. El JWT va firmado. Las contraseñas se guardan con BCrypt: es lento a propósito y lleva salt, lo que frena la fuerza bruta.","¿Quién emite el token y quién lo valida? ¿Por qué BCrypt y no SHA-256 simple?",`@Bean
SecurityFilterChain chain(HttpSecurity http) throws Exception {
  return http
    .authorizeHttpRequests(a -> a.anyRequest().authenticated())
    .oauth2ResourceServer(o -> o.jwt(Customizer.withDefaults()))
    .build();
}`]],
"Git, Maven y CI":[
["Git: merge, rebase y revert","Merge une historias con un commit de unión. Rebase reaplica tus commits sobre otra base para un historial lineal (no lo uses en ramas compartidas). Revert crea un commit que deshace otro sin reescribir el historial.","Subiste un error a una rama compartida. ¿Qué haces? git revert, no un reset con force push.",`git rebase main        # mi rama, historial lineal
git revert abc1234     # deshace un commit ya publicado
# Evitar: git push --force en ramas compartidas`],
["Maven","Maven gestiona dependencias y el ciclo de vida del build. mvn clean install limpia, compila, ejecuta tests y empaqueta en el repositorio local; deploy lo publica en Nexus. El scope test deja una dependencia fuera del artefacto final.","¿Qué hace mvn clean install y qué indica el scope test?",`&lt;dependency&gt;
  &lt;groupId&gt;org.mockito&lt;/groupId&gt;
  &lt;artifactId&gt;mockito-core&lt;/artifactId&gt;
  &lt;scope&gt;test&lt;/scope&gt;   &lt;!-- solo para pruebas --&gt;
&lt;/dependency&gt;`],
["Jenkins y BDD","Un Jenkinsfile define el pipeline como código, versionado con el proyecto. BDD describe el comportamiento en escenarios Given-When-Then que entienden negocio, desarrollo y QA.","¿Qué etapas tiene un pipeline típico? ¿Qué es BDD?",`pipeline {
  agent any
  stages {
    stage('Build') { steps { sh 'mvn clean package' } }
    stage('Test')  { steps { sh 'mvn test' } }
    stage('Sonar') { steps { sh 'mvn sonar:sonar' } }
  }
}
// BDD: Given saldo 100 / When transfiero 150 / Then se rechaza`]],
"Azure y CI/CD":[
["AKS y ACR","AKS es Kubernetes administrado por Azure: ejecuta y escala tus contenedores. ACR es el registro donde se guardan y versionan las imágenes que AKS descarga.","¿Qué diferencia hay entre ACR y AKS? ACR guarda las imágenes; AKS las ejecuta.",`docker build -t miacr.azurecr.io/cuentas:1.0 .
docker push miacr.azurecr.io/cuentas:1.0   # queda en ACR

function imp(f){
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);
    if(typeof d.xp!=='number'||typeof d.st!=='object'||!d.st)throw 0;
    S=d;save();render();alert('Progreso importado.');
  }catch(e){alert('El archivo no es válido.')}};
  r.readAsText(f);
}
render();
