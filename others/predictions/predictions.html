<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Armar pronóstico</title>
<style>
:root{--bg:#f4f6f1;--card:#fff;--ink:#16210f;--muted:#5d6b52;--line:#d5dccb;--accent:#2f6b2a;--accent-ink:#fff;--ok:#1f5a1b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10160d;--card:#18200f;--ink:#e9f0e1;--muted:#9fb08f;--line:#2e3a24;--accent:#6fbf63;--accent-ink:#0c1408;--ok:#8fd884;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10160d;--card:#18200f;--ink:#e9f0e1;--muted:#9fb08f;--line:#2e3a24;--accent:#6fbf63;--accent-ink:#0c1408;--ok:#8fd884;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;line-height:1.5}
main{max-width:30rem;margin:0 auto;padding:1.5rem 1rem 3rem}
h1{font-family:Georgia,"Times New Roman",serif;font-size:1.9rem;line-height:1.15;margin:0 0 .35rem}
p.sub{margin:0 0 1.5rem;color:var(--muted)}
form{background:var(--card);border:1px solid var(--line);border-radius:.9rem;padding:1.25rem}
label{display:block;font-weight:600;margin:1rem 0 .35rem}
label:first-of-type{margin-top:0}
select,input{width:100%;min-height:3rem;padding:0 .75rem;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:.55rem}
select:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:.6rem;margin-top:1.25rem}
button{min-height:3rem;font:inherit;font-weight:700;border-radius:.55rem;cursor:pointer;border:1px solid var(--accent)}
#copy{flex:1;background:var(--accent);color:var(--accent-ink)}
#clear{padding:0 1rem;background:transparent;color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.5;cursor:not-allowed}
.preview{margin-top:1.25rem}
.preview h2{font-size:.95rem;margin:0 0 .4rem;color:var(--muted);font-weight:600}
pre{margin:0;padding:.9rem 1rem;background:var(--bg);border:1px dashed var(--line);border-radius:.55rem;white-space:pre-wrap;word-break:break-word;font:inherit;min-height:5.5rem}
#status{min-height:1.4rem;margin:.6rem 0 0;color:var(--ok);font-weight:600}
</style>
</head>
<body>
<main>
<h1>Armar pronóstico</h1>
<p class="sub">Elige la competición, escribe los dos equipos y copia el mensaje en un chat nuevo del proyecto.</p>
<form id="f" autocomplete="off">
<label for="liga">Competición</label>
<select id="liga" required>
<option value="">Selecciona una competición</option>
<option>Brasileirão</option>
<option>Bundesliga Alemania</option>
<option>Champions League UEFA</option>
<option>Concacaf Champions Cup</option>
<option>Conference League UEFA</option>
<option>Copa América</option>
<option>Copa del Mundo FIFA</option>
<option>Copa del Rey España</option>
<option>Copa Libertadores</option>
<option>Copa Sudamericana</option>
<option>EFL Cup Inglaterra</option>
<option>Eurocopa</option>
<option>Europa League UEFA</option>
<option>FA Cup Inglaterra</option>
<option>La Liga España</option>
<option>Liga 1 Perú</option>
<option>Liga Profesional Argentina</option>
<option>Ligue 1 Francia</option>
<option>MLS</option>
<option>Nations League UEFA</option>
<option>Premier League Inglaterra</option>
<option>Serie A Italia</option>
<option>Supercopa de España</option>
<option>Supercopa de la UEFA</option>
</select>
<label for="local">Equipo local</label>
<input id="local" maxlength="80" placeholder="Ej. Sport Huancayo">
<label for="visita">Equipo visitante</label>
<input id="visita" maxlength="80" placeholder="Ej. Universitario">
<div class="row">
<button type="button" id="copy" disabled>Copiar mensaje</button>
<button type="button" id="clear">Limpiar equipos</button>
</div>
<p id="status" role="status" aria-live="polite"></p>
<div class="preview">
<h2>Mensaje</h2>
<pre id="out">Completa los tres campos.</pre>
</div>
</form>
</main>
<script>
(function(){
var liga=document.getElementById('liga'),local=document.getElementById('local'),visita=document.getElementById('visita'),
out=document.getElementById('out'),copy=document.getElementById('copy'),clear=document.getElementById('clear'),status=document.getElementById('status');
try{var s=localStorage.getItem('liga');if(s)liga.value=s;}catch(e){}
function msg(){return 'Liga: '+liga.value+'\nLocal: '+local.value.trim()+'\nVisitante: '+visita.value.trim();}
function ready(){return liga.value&&local.value.trim()&&visita.value.trim();}
function update(){
var ok=!!ready();copy.disabled=!ok;
out.textContent=ok?msg():'Completa los tres campos.';
status.textContent='';
}
function fallback(t){
var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';
document.body.appendChild(a);a.select();var r=false;
try{r=document.execCommand('copy');}catch(e){}
document.body.removeChild(a);return r;
}
copy.addEventListener('click',function(){
if(!ready())return;
var t=msg();
function done(ok){status.textContent=ok?'Copiado. Pégalo en un chat nuevo.':'No se pudo copiar. Selecciona el mensaje y cópialo a mano.';}
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(t).then(function(){done(true);},function(){done(fallback(t));});
}else{done(fallback(t));}
});
clear.addEventListener('click',function(){local.value='';visita.value='';update();local.focus();});
liga.addEventListener('change',function(){try{localStorage.setItem('liga',liga.value);}catch(e){}update();});
local.addEventListener('input',update);visita.addEventListener('input',update);
update();
})();
</script>
</body>
</html>
